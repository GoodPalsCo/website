<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're in! | Good Pals & Co.</title>
  <meta name="robots" content="noindex">

  <!-- Brand fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #1E1E1E;
      --tomato: #E64B3B;
      --citron: #D9E74A;
      --lilac: #C9B6F4;
      --cream: #F7F3E8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Baloo 2', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      text-align: center;
    }

    main { max-width: 560px; width: 100%; }

    .note {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: var(--tomato);
      transform: rotate(-3deg);
      display: inline-block;
      margin-bottom: 8px;
    }

    h1 {
      font-weight: 800;
      font-size: clamp(2.6rem, 9vw, 4.2rem);
      line-height: 1;
      margin-bottom: 20px;
    }

    h1 span {
      background: linear-gradient(transparent 55%, var(--lilac) 55%, var(--lilac) 90%, transparent 90%);
      padding: 0 6px;
    }

    .card {
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 6px 6px 0 var(--citron);
      margin-bottom: 32px;
    }

    .card p {
      font-size: 1.2rem;
      line-height: 1.45;
    }

    .card p + p { margin-top: 12px; }

    .button {
      display: inline-block;
      background: var(--tomato);
      color: var(--cream);
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
      padding: 12px 28px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      transition: transform 0.15s ease;
    }

    .button:hover { transform: translateY(-2px); }

    .home {
      display: block;
      margin-top: 20px;
      color: var(--ink);
      font-weight: 700;
      text-decoration-color: var(--tomato);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="note">yay, welcome!</p>
    <h1><span>You're in</span>, pal.</h1>

    <div class="card">
      <p>Thanks for joining Good Pals. We'll keep you posted as things grow, with stories, creative projects and simple ways to make a difference.</p>
      <p>Tip: add <strong>hello@goodpals.ca</strong> to your contacts so our emails land in your inbox.</p>
    </div>

    <a class="button" href="https://www.instagram.com/goodpals.ca/" target="_blank" rel="noopener">Follow @goodpals.ca</a>
    <a class="home" href="./">Back to Good Pals</a>
  </main>
</body>
</html>

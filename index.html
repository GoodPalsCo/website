<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Pals & Co.</title>
  <meta name="description" content="A community of good people helping our goodest pals.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Reenie+Beanie&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <main>
    <!-- Logo (upload your logo as logo.png). Shows a text version until it's there. -->
    <img class="logo" src="logo.png" alt="Good Pals & Co."
         onerror="this.style.display='none';document.getElementById('wordmark').hidden=false;">
    <p id="wordmark" class="wordmark" hidden>Good Pals <span class="amp">&amp;</span> Co.</p>

    <p class="note">something good is coming</p>
    <p class="tagline">A community of good people<br class="br-mobile"> helping our goodest pals.</p>

    <div class="card">
      <!-- Kit signup form (loads live from Kit — edit the form in Kit, not here) -->
      <script async data-uid="5cbea668c0" src="https://good-pals-co.kit.com/5cbea668c0/index.js"></script>
    </div>

    <div class="say-hi">
      <span class="scribble">
        psst… come say hi
        <svg class="arrow" viewBox="0 0 38 30" aria-hidden="true">
          <path d="M3 4 C 14 2, 26 8, 30 22"/>
          <path d="M23 18 L30 23 L33 14"/>
        </svg>
      </span>
      <a class="sticker" href="https://www.instagram.com/goodpals.ca/" target="_blank" rel="noopener" aria-label="Good Pals on Instagram"><img class="ig" src="instagram-icon.png" alt="" onerror="this.remove()"><span>@goodpals.ca</span></a>
    </div>
  </main>
</body>
</html>

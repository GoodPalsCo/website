<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Pals & Co.</title>
  <meta name="description" content="A community of good people helping good pets.">

  <!-- Brand fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #1E1E1E;
      --tomato: #E64B3B;
      --citron: #D9E74A;
      --lilac: #C9B6F4;
      --cream: #F7F3E8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Baloo 2', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      text-align: center;
    }

    main { max-width: 560px; width: 100%; }

    .note {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: var(--tomato);
      transform: rotate(-3deg);
      display: inline-block;
      margin-bottom: 8px;
    }

    h1 {
      font-weight: 800;
      font-size: clamp(2.6rem, 9vw, 4.2rem);
      line-height: 1;
      margin-bottom: 20px;
    }

    /* Lilac marker swash behind the headline */
    h1 span {
      background: linear-gradient(transparent 55%, var(--lilac) 55%, var(--lilac) 90%, transparent 90%);
      padding: 0 6px;
    }

    .tagline {
      font-size: 1.25rem;
      line-height: 1.4;
      margin-bottom: 32px;
    }

    .form-wrap {
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 6px 6px 0 var(--citron);
    }

    footer {
      margin-top: 40px;
      font-size: 1rem;
    }

    footer a {
      color: var(--ink);
      font-weight: 700;
      text-decoration-color: var(--tomato);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    /* ---- Kit form styling (overrides Kit's built-in styles) ---- */
    .formkit-form {
      max-width: 100% !important;
      background: transparent !important;
      border: none !important;
      font-family: 'Baloo 2', sans-serif !important;
    }
    .formkit-form h2,
    .formkit-form .formkit-header {
      font-family: 'Baloo 2', sans-serif !important;
      color: var(--ink) !important;
    }
    .formkit-input {
      font-family: 'Baloo 2', sans-serif !important;
      font-size: 1rem !important;
      border: 2px solid var(--ink) !important;
      border-radius: 12px !important;
    }
    .formkit-submit {
      font-family: 'Baloo 2', sans-serif !important;
      font-weight: 700 !important;
      font-size: 1.05rem !important;
      background-color: var(--tomato) !important;
      color: var(--cream) !important;
      border-radius: 12px !important;
    }
  </style>
</head>
<body>
  <main>
    <p class="note">something good is coming</p>
    <h1><span>Good Pals</span> &amp; Co.</h1>
    <p class="tagline">A community of good people helping good pets.</p>

    <div class="form-wrap">

      <!-- ============================================== -->

    </div>

    <footer>
      Follow along on Instagram: <a href="https://www.instagram.com/goodpals.ca/" target="_blank" rel="noopener">@goodpals.ca</a>
    </footer>
  </main>
</body>
</html>
